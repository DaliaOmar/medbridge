# Deploy this Blueprint from the repository root in Render.
# It creates the API and its PostgreSQL database together.
services:
  - type: web
    name: medbridge-api
    runtime: node
    region: egypt
    plan: free
    rootDir: backend
   
    buildCommand: npm ci && npx prisma generate && npm run build
    # Keep devDependencies available while compiling TypeScript. NODE_ENV is
    # applied only to the running API, after the build has completed.
    startCommand: npx prisma migrate deploy && npm start
    startCommand: npx prisma migrate deploy && NODE_ENV=production npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
    envVars:
      # Render exposes these variables during the build as well. Keep this in
      # development so npm installs TypeScript and the required type packages.
      # The start command above switches the running API to production.
      - key: NODE_ENV
        value: development
      - key: FRONTEND_URL
