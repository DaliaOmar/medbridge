# Deploy this Blueprint from the repository root in Render.
# It creates the API and its PostgreSQL database together.
services:
  - type: web
    name: medbridge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    autoDeploy: true
    routes:
      # Keep API requests same-origin in the browser while Render proxies them
      # to the API service. This avoids weakening the API CORS policy.
      - type: rewrite
        source: /api/*
        destination: https://medbridge-api-791a.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: medbridge-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    # TypeScript compilation needs the packages listed under devDependencies,
    # even if Render has NODE_ENV set to production during the build.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Run the API itself in production after the build and database migration.
    startCommand: npx prisma migrate deploy && NODE_ENV=production npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Render exposes this variable during the build too. Keep it in
      # development so npm installs TypeScript and its type declarations.
      - key: NODE_ENV
        value: development
      - key: FRONTEND_URL
        value: https://medbridgeacademy0.netlify.app
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: medbridge-db
          property: connectionString

databases:
  - name: medbridge-db
    databaseName: medbridge
    user: medbridge
    region: frankfurt
    plan: free
